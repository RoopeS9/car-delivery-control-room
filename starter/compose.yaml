services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: controlroom
      POSTGRES_PASSWORD: controlroom
      POSTGRES_DB: controlroom
    ports:
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlroom -d controlroom"]
      interval: 2s
      retries: 20
    volumes:
      - controlroom_pg:/var/lib/postgresql/data

  attachments:
    image: rustfs/rustfs:1.0.1
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-controlroom}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-controlroom-local-only}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9009:9000"
      - "127.0.0.1:9010:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      retries: 30
    volumes:
      - controlroom_attachments:/data

volumes:
  controlroom_pg:
  controlroom_attachments:
